schema_version: 1

context:
  name: readwritememory
  version: "0.1.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ReadWriteMemory-${{ version }}.tar.gz
  sha256: 6a194074dc760809db03ec744bbd1e0eec649c32d016400c0ae7b32cf649d08d

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ReadWriteMemory
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: ReadWriteMemory Class to work with Windows process memory and hacking video games.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/vsantiago113/ReadWriteMemory

extra:
  recipe-maintainers:
    - jan-janssen
